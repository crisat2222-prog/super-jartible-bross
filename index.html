<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Súper Jartible Bross</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">

    <!-- TÍTULO -->
    <section id="title" class="screen active">
      <div class="title-card">
      <h1>SÚPER<br>JARTIBLE<br>BROSS</h1>
      <button id="btn-start" class="btn">Nueva partida</button>
      <button id="btn-continue" class="btn alt" hidden>Continuar</button>
      <button id="btn-reset" class="link" hidden>Borrar progreso</button>
    </div>
    </section>

    <!-- HISTORIA -->
    <section id="story" class="screen">
      <div class="dialog">
        <p id="story-text"></p>
        <span class="hint">Pulsa para continuar</span>
      </div>
    </section>

    <!-- MAPA DE MUNDOS -->
    <section id="worlds" class="screen">
      <h2>Elige tu camino</h2>
      <p id="simbolos" style="font-size:12px;margin-bottom:1.5rem"></p>
      <canvas id="mapa" width="1280" height="720"></canvas>
      <button id="btn-title" class="link">Volver al título</button>
    </section>

    <!-- MUNDO (aquí irá el juego de cada nivel) -->
    <section id="level" class="screen">
      <h2 id="level-name"></h2>
      <canvas id="canvas" width="640" height="360"></canvas>
      <p class="hint">ENTER avanzar · Clic responder</p>
      <button id="btn-win" class="btn">Superar mundo</button>
      <button id="btn-exit" class="link">Salir al mapa</button>
    </section>

  </main>
  <script src="ui.js"></script>
  <script src="mapa.js"></script>
  <script src="mundo1.js"></script>
  <script src="mundo2.js"></script>
  <script src="mundo3.js"></script>
  <script src="mundo4.js"></script>
  <script src="mundo5.js"></script>
  <script src="main.js"></script>
</body>
</html>
